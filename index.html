<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FiaFox Flashcards</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: #0f0f1a;
    color: #fff;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 20px;
  }
  h1 { font-size: 1.8rem; margin-bottom: 4px; color: #ff6b35; }
  .subtitle { color: #aaa; margin-bottom: 24px; font-size: 0.9rem; }
  .progress { color: #aaa; margin-bottom: 16px; font-size: 0.95rem; }
  .card-container {
    width: 100%;
    max-width: 680px;
    perspective: 1200px;
    margin-bottom: 24px;
  }
  .card {
    width: 100%;
    min-height: 260px;
    position: relative;
    transform-style: preserve-3d;
    transition: transform 0.55s ease;
    cursor: pointer;
    border-radius: 18px;
  }
  .card.flipped { transform: rotateY(180deg); }
  .front, .back {
    position: absolute;
    width: 100%;
    min-height: 260px;
    border-radius: 18px;
    backface-visibility: hidden;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    padding: 32px;
    text-align: center;
  }
  .front {
    background: linear-gradient(135deg, #1a1a2e, #16213e);
    border: 2px solid #ff6b35;
  }
  .back {
    background: linear-gradient(135deg, #1a2a1a, #0d2a0d);
    border: 2px solid #4caf50;
    transform: rotateY(180deg);
  }
  .tag {
    font-size: 0.75rem;
    font-weight: 700;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 16px;
    padding: 4px 12px;
    border-radius: 20px;
    background: rgba(255,107,53,0.15);
    color: #ff6b35;
  }
  .back .tag {
    background: rgba(76,175,80,0.15);
    color: #4caf50;
  }
  .question {
    font-size: 1.2rem;
    font-weight: 600;
    line-height: 1.5;
    color: #fff;
  }
  .answer {
    font-size: 1rem;
    line-height: 1.7;
    color: #e0e0e0;
  }
  .answer code {
    background: rgba(255,255,255,0.1);
    padding: 2px 6px;
    border-radius: 4px;
    font-family: monospace;
    color: #ffd54f;
    font-size: 0.9rem;
  }
  .hint {
    margin-top: 12px;
    font-size: 0.8rem;
    color: #888;
  }
  .buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
    justify-content: center;
  }
  button {
    padding: 12px 28px;
    border: none;
    border-radius: 10px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
  }
  .btn-flip {
    background: #ff6b35;
    color: #fff;
  }
  .btn-flip:hover { background: #e55a25; transform: translateY(-2px); }
  .btn-prev {
    background: #333;
    color: #fff;
  }
  .btn-prev:hover { background: #444; }
  .btn-next {
    background: #4caf50;
    color: #fff;
  }
  .btn-next:hover { background: #388e3c; transform: translateY(-2px); }
  .category-filter {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    justify-content: center;
    margin-bottom: 20px;
  }
  .cat-btn {
    padding: 6px 16px;
    border-radius: 20px;
    border: 1px solid #444;
    background: #1a1a2e;
    color: #aaa;
    cursor: pointer;
    font-size: 0.8rem;
    transition: all 0.2s;
  }
  .cat-btn.active {
    background: #ff6b35;
    color: #fff;
    border-color: #ff6b35;
  }
  .score-bar {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
    font-size: 0.85rem;
    color: #aaa;
  }
  .score-bar span { color: #fff; font-weight: 700; }
</style>
</head>
<body>

<h1>🦊 FiaFox Flashcards</h1>
<p class="subtitle">Advanced Database & Analytics — Demo Prep</p>

<div class="category-filter" id="catFilter"></div>

<div class="score-bar">
  Studied: <span id="studiedCount">0</span> / <span id="totalCount">0</span>
</div>

<div class="progress" id="progress">Card 1 of 20</div>

<div class="card-container">
  <div class="card" id="card" onclick="flipCard()">
    <div class="front">
      <div class="tag" id="frontTag">Topic</div>
      <div class="question" id="question">Loading...</div>
      <div class="hint">👆 Click to reveal answer</div>
    </div>
    <div class="back">
      <div class="tag" id="backTag">Answer</div>
      <div class="answer" id="answer">Loading...</div>
    </div>
  </div>
</div>

<div class="buttons">
  <button class="btn-prev" onclick="prevCard()">← Previous</button>
  <button class="btn-flip" onclick="flipCard()">Flip Card</button>
  <button class="btn-next" onclick="nextCard()">Next →</button>
</div>

<script>
const allCards = [
  {
    category: "Entities",
    question: "What is a Strong Entity? Give an example from FiaFox.",
    answer: "A strong entity can exist on its own without depending on another table. Examples in FiaFox: customers, products, suppliers, categories — they all exist independently."
  },
  {
    category: "Entities",
    question: "What is a Weak Entity? Give an example from FiaFox.",
    answer: "A weak entity cannot exist without a parent entity. In FiaFox: order_items cannot exist without an order, and reviews cannot exist without both a customer and a product."
  },
  {
    category: "Entities",
    question: "Why is order_items a weak entity in FiaFox?",
    answer: "Because order_items is dependent on orders and cannot exist without one. If the order is deleted, all its items are deleted too — which is why we used ON DELETE CASCADE on the foreign key."
  },
  {
    category: "ERD",
    question: "What is the relationship between orders and order_items?",
    answer: "One-to-Many (1:M). One order can contain many order items — for example, one order might include a phone, a case, and headphones as three separate order_items."
  },
  {
    category: "ERD",
    question: "What does ON DELETE CASCADE mean in your database?",
    answer: "It means if a parent record is deleted, all related child records are automatically deleted too. In FiaFox, if an order is deleted, all its order_items are automatically removed."
  },
  {
    category: "ERD",
    question: "What is a Foreign Key? Give an example from FiaFox.",
    answer: "A foreign key is a column that links one table to another. Example: customer_id in the orders table is a foreign key that references the customer_id primary key in the customers table."
  },
  {
    category: "ERD",
    question: "How many tables does FiaFox have and what are they?",
    answer: "7 tables: customers, categories, suppliers, products, orders, order_items, and reviews."
  },
  {
    category: "Normalisation",
    question: "What is First Normal Form (1NF)?",
    answer: "Every column must have atomic (single) values, no repeating groups, and every row must be unique. FiaFox satisfies this — for example, instead of storing multiple products in one order row, we use a separate order_items table."
  },
  {
    category: "Normalisation",
    question: "What is Second Normal Form (2NF)?",
    answer: "Must be in 1NF with no partial dependencies — every non-key attribute must depend on the entire primary key. FiaFox satisfies this because all tables use single surrogate primary keys, so partial dependencies cannot exist."
  },
  {
    category: "Normalisation",
    question: "What is Third Normal Form (3NF)?",
    answer: "Must be in 2NF with no transitive dependencies — every attribute must depend directly on the primary key, not on other non-key attributes. FiaFox satisfies this — all attributes in each table depend only on their primary key."
  },
  {
    category: "Normalisation",
    question: "Why did your FiaFox database not need changes during normalisation?",
    answer: "Because it was designed with normalisation in mind from the start. Key decisions like separating order_items from orders, and isolating categories and suppliers into their own tables, meant all three normal forms were already satisfied."
  },
  {
    category: "SQL Queries",
    question: "What is a Non-Correlated Subquery? What does Q1 do in FiaFox?",
    answer: "A non-correlated subquery runs independently of the outer query — it executes once and returns a single value. Q1 finds all products priced above the overall average price by calculating AVG(price) once in the inner query."
  },
  {
    category: "SQL Queries",
    question: "What is a Correlated Subquery? What does Q2 do in FiaFox?",
    answer: "A correlated subquery references the outer query and runs once per row. Q2 finds each customer's most recent order date — the inner query references the current customer's ID from the outer query, so it runs once per customer."
  },
  {
    category: "SQL Queries",
    question: "What is a CTE (WITH query)? What does Q3 do in FiaFox?",
    answer: "A CTE (Common Table Expression) creates a temporary named result set you can reference in the main query. Q3 calculates total revenue per category in the CTE, then ranks them by revenue in the outer query."
  },
  {
    category: "SQL Queries",
    question: "What is a Window Function? What does Q4 do in FiaFox?",
    answer: "A window function performs calculations across rows related to the current row without collapsing them. Q4 uses RANK() to rank customers by total spending — so you can see who FiaFox's top spenders are."
  },
  {
    category: "SQL Queries",
    question: "What does the Q5 Running Total query do in FiaFox?",
    answer: "It calculates cumulative revenue month by month using SUM() OVER (ORDER BY month). This shows FiaFox's total revenue building up over time, which helps identify growth trends."
  },
  {
    category: "Triggers & Procedures",
    question: "What does your Q8 trigger do in FiaFox?",
    answer: "The trigger trg_update_stock fires automatically after a new order_item is inserted. It reduces the product's stock_quantity by the quantity ordered, and logs the change in the stock_log table — keeping inventory accurate automatically."
  },
  {
    category: "Triggers & Procedures",
    question: "What does your Q7 stored function do in FiaFox?",
    answer: "The function get_customer_summary() takes a customer_id and returns that customer's total orders, total spend, average order value, first order date and latest order date — useful for customer service staff."
  },
  {
    category: "Transactions & Security",
    question: "What is a Transaction? Explain BEGIN / COMMIT / ROLLBACK.",
    answer: "A transaction groups multiple SQL statements into one atomic operation. BEGIN starts it, COMMIT saves all changes permanently, and ROLLBACK undoes everything if something goes wrong. In FiaFox this ensures an order and its items are always inserted together or not at all."
  },
  {
    category: "Transactions & Security",
    question: "What are your two PostgreSQL roles and what can they do?",
    answer: "fiafox_admin has full privileges on all tables. fiafox_staff has read-only SELECT access to customers, products, orders, categories and order_items — but is explicitly REVOKED from accessing reviews and stock_log."
  },
  {
    category: "Transactions & Security",
    question: "What is MVCC and why is it relevant to FiaFox?",
    answer: "MVCC stands for Multi-Version Concurrency Control. PostgreSQL uses it so readers never block writers and writers never block readers. This is critical for FiaFox where multiple customers may be placing orders simultaneously — it keeps data accurate without slowing down."
  },
  {
    category: "Performance",
    question: "What indexes did you create in Q11 and why?",
    answer: "Three indexes: idx_orders_customer_id on orders(customer_id), idx_order_items_order_id on order_items(order_id), and idx_order_items_product_id on order_items(product_id). These speed up JOIN operations by allowing PostgreSQL to use Index Scans instead of slow Sequential Scans."
  },
  {
    category: "Performance",
    question: "What is the difference between a Sequential Scan and an Index Scan in EXPLAIN ANALYZE?",
    answer: "A Sequential Scan reads every row in the table one by one — slow for large tables. An Index Scan uses the index to jump directly to the relevant rows — much faster. After adding indexes in Q11, PostgreSQL switched from Sequential to Index Scans."
  },
  {
    category: "Project",
    question: "Why did you choose FiaFox as your project?",
    answer: "I chose FiaFox because I have experience working alongside a real business called Bia Box, which gave me insight into how small online retail businesses operate. I wanted my database to closely reflect a real world e-commerce system with customers, suppliers, products, orders and analytics."
  }
];

let currentCards = [...allCards];
let currentIndex = 0;
let isFlipped = false;
let studied = new Set();
let activeCategory = "All";

const categories = ["All", ...new Set(allCards.map(c => c.category))];

function buildCategoryFilter() {
  const container = document.getElementById("catFilter");
  categories.forEach(cat => {
    const btn = document.createElement("button");
    btn.className = "cat-btn" + (cat === "All" ? " active" : "");
    btn.textContent = cat;
    btn.onclick = () => filterCategory(cat);
    container.appendChild(btn);
  });
}

function filterCategory(cat) {
  activeCategory = cat;
  document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
  event.target.classList.add("active");
  currentCards = cat === "All" ? [...allCards] : allCards.filter(c => c.category === cat);
  currentIndex = 0;
  isFlipped = false;
  document.getElementById("card").classList.remove("flipped");
  updateCard();
}

function updateCard() {
  const card = currentCards[currentIndex];
  document.getElementById("question").textContent = card.question;
  document.getElementById("answer").innerHTML = card.answer.replace(/`([^`]+)`/g, '<code>$1</code>');
  document.getElementById("frontTag").textContent = card.category;
  document.getElementById("backTag").textContent = "✅ Answer";
  document.getElementById("progress").textContent = `Card ${currentIndex + 1} of ${currentCards.length}`;
  document.getElementById("studiedCount").textContent = studied.size;
  document.getElementById("totalCount").textContent = allCards.length;
}

function flipCard() {
  isFlipped = !isFlipped;
  document.getElementById("card").classList.toggle("flipped");
  if (isFlipped) studied.add(currentIndex + "_" + activeCategory);
  document.getElementById("studiedCount").textContent = studied.size;
}

function nextCard() {
  currentIndex = (currentIndex + 1) % currentCards.length;
  isFlipped = false;
  document.getElementById("card").classList.remove("flipped");
  updateCard();
}

function prevCard() {
  currentIndex = (currentIndex - 1 + currentCards.length) % currentCards.length;
  isFlipped = false;
  document.getElementById("card").classList.remove("flipped");
  updateCard();
}

buildCategoryFilter();
updateCard();
</script>
</body>
</html>
